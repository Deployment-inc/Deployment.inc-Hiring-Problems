<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deployment.inc — Open Problems, Season 1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap');

  :root {
    --bg: #08090a;
    --white: #f4f4f2;
    --muted: #a4a6aa;
    --line: #2b2d30;
    --soft: #d7d8da;
    --accent1: #3D7BFF;
    --accent2: #2FC6A0;
    --accent3: #E8C15A;
    --accent4: #E86A2B;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%;
    background:var(--bg);
    font-family: "Bricolage Grotesque", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  @media print {
    @page { size: 16in 9in; margin: 0; }
    html, body { width:16in; height:9in; }
    .frame { width:16in; height:9in; }
  }

  .frame {
    position:relative;
    width:1920px; height:1080px;
    background:var(--bg);
    overflow:hidden;
  }

  /* ---------- Centered headline block ---------- */
  .center-block {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -58%);
    text-align:center;
    width:78%;
    z-index:3;
  }

  .eyebrow-center {
    font-size:19px;
    letter-spacing:.32em;
    color:var(--muted);
    font-weight:600;
    text-transform:uppercase;
    margin-bottom:28px;
  }

  .headline-center {
    font-family:"Bricolage Grotesque", sans-serif;
    font-size:84px;
    font-weight:760;
    line-height:1.02;
    letter-spacing:-.03em;
    color:var(--white);
  }

  /* ---------- Faint distributed-trace timeline, right side ---------- */
  .trace-panel {
    position:absolute;
    right:6.5%;
    top:70%;
    transform:translateY(-50%);
    width:27%;
    z-index:1;
  }

  .trace-caption {
    margin-top:18px;
    font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size:14px;
    letter-spacing:.02em;
    color:var(--muted);
    opacity:.85;
    text-align:right;
  }

  /* ---------- Bottom numeral row ---------- */
  .numerals-row {
    position:absolute;
    bottom:64px;
    left:50%;
    transform:translateX(-50%);
    width:66%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:3;
  }

  .numeral {
    font-family:"SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size:16px;
    letter-spacing:.08em;
    color:#3a3c40;
    font-weight:500;
  }

  .numeral.active {
    color:var(--accent4);
    font-weight:700;
  }
</style>
</head>
<body>
<main class="frame" aria-label="Deployment.inc — Open Problems, Season 1">

  <div class="center-block">
    <div class="eyebrow-center">DEPLOYMENT.INC &middot; OPEN PROBLEMS &middot; SEASON 1</div>
    <h1 class="headline-center">Build the thing that survives<br>contact with production.</h1>
  </div>

  <div class="trace-panel">
    <svg viewBox="0 0 520 320" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="spanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#3D7BFF"/>
          <stop offset="35%" stop-color="#2FC6A0"/>
          <stop offset="70%" stop-color="#E8C15A"/>
          <stop offset="100%" stop-color="#E86A2B"/>
        </linearGradient>
      </defs>

      <!-- faint monochrome spans -->
      <rect x="0"   y="8"   width="480" height="10" rx="2" fill="#ffffff" opacity="0.10"/>
      <rect x="24"  y="34"  width="392" height="10" rx="2" fill="#ffffff" opacity="0.14"/>
      <rect x="48"  y="60"  width="150" height="10" rx="2" fill="#ffffff" opacity="0.16"/>
      <rect x="210" y="60"  width="176" height="10" rx="2" fill="#ffffff" opacity="0.12"/>
      <rect x="64"  y="86"  width="88"  height="10" rx="2" fill="#ffffff" opacity="0.18"/>
      <rect x="300" y="86"  width="132" height="10" rx="2" fill="#ffffff" opacity="0.13"/>
      <rect x="40"  y="112" width="66"  height="10" rx="2" fill="#ffffff" opacity="0.16"/>
      <rect x="128" y="112" width="118" height="10" rx="2" fill="#ffffff" opacity="0.11"/>

      <!-- the one highlighted span -->
      <rect x="228" y="112" width="70" height="10" rx="2" fill="url(#spanGradient)" opacity="0.95"/>

      <rect x="356" y="112" width="94"  height="10" rx="2" fill="#ffffff" opacity="0.14"/>
      <rect x="40"  y="138" width="220" height="10" rx="2" fill="#ffffff" opacity="0.12"/>
      <rect x="284" y="138" width="60"  height="10" rx="2" fill="#ffffff" opacity="0.17"/>
      <rect x="360" y="138" width="112" height="10" rx="2" fill="#ffffff" opacity="0.10"/>
      <rect x="64"  y="164" width="150" height="10" rx="2" fill="#ffffff" opacity="0.15"/>
      <rect x="240" y="164" width="90"  height="10" rx="2" fill="#ffffff" opacity="0.11"/>
      <rect x="356" y="164" width="130" height="10" rx="2" fill="#ffffff" opacity="0.13"/>
      <rect x="24"  y="190" width="340" height="10" rx="2" fill="#ffffff" opacity="0.09"/>
      <rect x="380" y="190" width="98"  height="10" rx="2" fill="#ffffff" opacity="0.15"/>
      <rect x="48"  y="216" width="112" height="10" rx="2" fill="#ffffff" opacity="0.13"/>
      <rect x="180" y="216" width="200" height="10" rx="2" fill="#ffffff" opacity="0.10"/>
      <rect x="64"  y="242" width="380" height="10" rx="2" fill="#ffffff" opacity="0.08"/>
    </svg>
    <div class="trace-caption">6 problems &middot; US$50 budget &middot; 7 Sept – 7 Dec 2026</div>
  </div>

  <div class="numerals-row">
    <div class="numeral active">01</div>
    <div class="numeral">02</div>
    <div class="numeral">03</div>
    <div class="numeral">04</div>
    <div class="numeral">05</div>
    <div class="numeral">06</div>
  </div>

</main>
</body>
</html>
